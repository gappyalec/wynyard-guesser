<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wynyard Guesser</title>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ── */
    :root {
      --bg: #0a0d0f;
      --surface: #111518;
      --surface2: #181c20;
      --border: #ffffff12;
      --accent: #00e5a0;
      --accent2: #ff6b35;
      --text: #e8eaed;
      --muted: #6b7280;
      --danger: #ff4444;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Screens ── */
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; }

    /* ── Join Screen ── */
    #join-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    #join-screen::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, #00e5a015 0%, transparent 70%);
      top: -200px; right: -200px;
      pointer-events: none;
    }

    #join-screen::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, #ff6b3510 0%, transparent 70%);
      bottom: -100px; left: -100px;
      pointer-events: none;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .logo-sub {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 3rem;
    }

    .join-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .join-card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.875rem 1rem;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.05em;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0d0f;
    }

    .btn-primary:hover { background: #00c988; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .error-msg {
      background: #ff444420;
      border: 1px solid #ff444440;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: var(--danger);
      margin-top: 1rem;
      display: none;
    }

    /* ── Lobby Screen ── */
    #lobby-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    .lobby-header {
      text-align: center;
    }

    .lobby-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
    }

    .room-code-display {
      font-family: 'DM Mono', monospace;
      font-size: 2rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 2rem;
      margin: 0.5rem 0;
    }

    .lobby-hint {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .player-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 440px;
    }

    .player-list h3 {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .player-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    .player-item:last-child { border-bottom: none; }

    .player-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .host-badge {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--accent2);
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      margin-left: auto;
    }

    .waiting-msg {
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
      padding: 0.5rem;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Game Screen ── */
    #game-screen {
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .game-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 1rem;
    }

    .hud-round {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .hud-round span {
      color: var(--accent);
      font-weight: 500;
    }

    .hud-timer {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.05em;
      transition: color 0.3s;
      min-width: 60px;
      text-align: center;
    }

    .hud-timer.urgent { color: var(--danger); animation: blink 0.5s step-end infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .hud-score {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: right;
    }

    .hud-score span {
      display: block;
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: 500;
    }

    .game-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* Photo panel */
    .photo-panel {
      flex: 0 0 40%;
      max-width: 40%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .photo-panel img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .photo-label {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      background: #0008;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: var(--muted);
      backdrop-filter: blur(4px);
    }

    /* Map panel */
    .map-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
    }

    .map-panel img.map-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      display: block;
    }

    /* Guess marker */
    .guess-marker {
      position: absolute;
      width: 24px; height: 24px;
      background: var(--accent2);
      border: 3px solid white;
      border-radius: 50% 50% 50% 0;
      transform: translate(-50%, -100%) rotate(-45deg);
      pointer-events: none;
      display: none;
      filter: drop-shadow(0 2px 4px #0008);
    }

    .guess-marker.visible { display: block; }

    .confirm-btn {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.875rem 2rem;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      letter-spacing: 0.1em;
      color: #0a0d0f;
      cursor: pointer;
      transition: all 0.2s;
      display: none;
    }

    .confirm-btn.visible { display: block; }
    .confirm-btn:hover { background: #00c988; transform: translateY(-2px); }
    .confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .guess-submitted-msg {
      position: absolute;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.875rem 2rem;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent);
      display: none;
    }

    .guess-submitted-msg.visible { display: block; }

    .guessed-count {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 0.75rem;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
    }

    /* ── Results Overlay ── */
    #results-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000c;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      backdrop-filter: blur(4px);
    }

    #results-overlay.visible { display: flex; }

    .results-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .results-card h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.75rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }

    .results-answer {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      font-family: 'DM Mono', monospace;
    }

    .results-answer span { color: var(--accent); }

    .result-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }

    .result-row:last-child { border-bottom: none; }

    .result-rank {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      min-width: 2rem;
      text-align: center;
    }

    .rank-1 { color: var(--gold); }
    .rank-2 { color: var(--silver); }
    .rank-3 { color: var(--bronze); }

    .result-name { flex: 1; font-weight: 500; }
    .result-you { font-size: 0.65rem; color: var(--accent); margin-left: 0.4rem; }

    .result-distance {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }

    .result-score {
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      color: var(--accent);
      min-width: 60px;
      text-align: right;
    }

    .next-countdown {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .next-countdown span { color: var(--accent); font-weight: 500; }

    /* ── Game Over Screen ── */
    #gameover-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      gap: 1.5rem;
    }

    #gameover-screen h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: 0.1em;
      text-align: center;
    }

    .final-scores {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
    }

    .final-scores h3 {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    .final-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.875rem 0;
      border-bottom: 1px solid var(--border);
    }

    .final-row:last-child { border-bottom: none; }

    .final-rank {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      min-width: 2.5rem;
      text-align: center;
    }

    .final-name { flex: 1; font-size: 1.1rem; font-weight: 500; }

    .final-score {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.75rem;
      color: var(--accent);
    }

    /* ── Reveal Panel (replaces photo during results phase) ── */
    .reveal-panel {
      display: none;
      position: absolute;
      inset: 0;
      background: var(--surface);
      flex-direction: column;
      padding: 1.25rem 1.5rem;
      overflow-y: auto;
      z-index: 5;
    }

    .reveal-panel.visible { display: flex; }

    .reveal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.75rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.2rem;
    }

    .reveal-subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 1.1rem;
    }

    .reveal-subtitle span { color: var(--accent); }

    .reveal-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    .reveal-row:last-child { border-bottom: none; }

    .reveal-rank {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem;
      min-width: 1.5rem;
      text-align: center;
    }

    .reveal-color-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1.5px solid #ffffff40;
    }

    .reveal-name { flex: 1; font-weight: 500; font-size: 0.88rem; }

    .reveal-dist {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .reveal-round-score {
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      color: var(--accent);
      min-width: 44px;
      text-align: right;
    }

    .reveal-total-score {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      min-width: 52px;
      text-align: right;
    }

    .reveal-footer {
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .reveal-countdown {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .reveal-countdown span { color: var(--accent); font-weight: 500; }

    /* ── Player Guess Markers (shown during reveal) ── */
    .player-guess-wrap {
      position: absolute;
      pointer-events: none;
      z-index: 14;
    }

    .player-guess-pin {
      position: absolute;
      width: 14px; height: 14px;
      border: 2.5px solid white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 6px #0008;
      left: 0; top: 0;
    }

    .player-guess-label {
      position: absolute;
      left: 0;
      transform: translateX(-50%);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      color: white;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 1px 4px #0008;
      line-height: 1.4;
    }

    .player-guess-label.is-me {
      outline: 2px solid white;
      outline-offset: 1px;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .game-body { flex-direction: column; }
      .photo-panel { flex: 0 0 35%; max-width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<!-- ═══════════════ JOIN SCREEN ═══════════════ -->
<div id="join-screen" class="screen active">
  <div class="logo">Wynyard<br>Guesser</div>
  <div class="logo-sub">Wynyard Quarter · Auckland NZ</div>

  <div class="join-card">
    <h2>Join Game</h2>

    <div class="field">
      <label>Invite Code</label>
      <input type="text" id="room-code-input" placeholder="XXXXXX" maxlength="6" autocomplete="off" style="text-transform:uppercase" />
    </div>

    <div class="field">
      <label>Your Name</label>
      <input type="text" id="player-name-input" placeholder="Enter display name" maxlength="20" autocomplete="off" />
    </div>

    <button class="btn btn-primary" id="join-btn" onclick="joinGame()">Join →</button>
    <div class="error-msg" id="join-error"></div>
  </div>
</div>

<!-- ═══════════════ LOBBY SCREEN ═══════════════ -->
<div id="lobby-screen" class="screen">
  <div class="lobby-header">
    <h1>Waiting Room</h1>
    <div class="lobby-hint">Share this code with players</div>
    <div class="room-code-display" id="lobby-code"></div>
    <div class="lobby-hint" id="round-count-display"></div>
  </div>

  <div class="player-list">
    <h3>Players <span id="player-count">(0)</span></h3>
    <div id="player-list-items"></div>
  </div>

  <div id="host-controls" style="display:none; width:100%; max-width:440px;">
    <button class="btn btn-primary" id="start-btn" onclick="startGame()">Start Game →</button>
  </div>

  <div id="waiting-msg" class="waiting-msg pulse">Waiting for host to start the game…</div>
</div>

<!-- ═══════════════ GAME SCREEN ═══════════════ -->
<div id="game-screen" class="screen">
  <div class="game-hud">
    <div class="hud-round">Round <span id="hud-round-num">1</span> of <span id="hud-total-rounds">5</span></div>
    <div class="hud-timer" id="hud-timer">30</div>
    <div class="hud-score">Your score<span id="hud-score">0</span></div>
  </div>

  <div class="game-body">
    <!-- Location photo -->
    <div class="photo-panel">
      <img id="round-photo" src="" alt="Where was this taken?" draggable="false" />
      <div class="photo-label" id="photo-label"></div>
      <!-- Scoreboard shown during the 30s reveal phase -->
      <div class="reveal-panel" id="reveal-panel">
        <div class="reveal-title">Round <span id="reveal-round-num">1</span> Results</div>
        <div class="reveal-subtitle" id="reveal-subtitle"></div>
        <div id="reveal-rows"></div>
        <div class="reveal-footer">
          <div class="reveal-countdown" id="reveal-countdown"></div>
        </div>
      </div>
    </div>

    <!-- Map -->
    <div class="map-panel" id="map-panel" onclick="handleMapClick(event)">
      <img class="map-img" id="map-img" src="" alt="Map" draggable="false" />
      <svg id="reveal-svg" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:11;display:none;overflow:visible"></svg>
      <div class="guess-marker" id="guess-marker"></div>
      <div class="guessed-count" id="guessed-count"></div>
      <button class="confirm-btn" id="confirm-btn" onclick="confirmGuess(event)">Confirm Guess ✓</button>
      <div class="guess-submitted-msg" id="guess-submitted-msg">✓ Guess submitted — waiting for others…</div>
    </div>
  </div>
</div>

<!-- Results overlay (shown between rounds) -->
<div id="results-overlay">
  <div class="results-card">
    <h2 id="results-title">Round Results</h2>
    <div class="results-answer" id="results-answer"></div>
    <div id="results-rows"></div>
    <div class="next-countdown" id="next-countdown"></div>
  </div>
</div>

<!-- ═══════════════ GAME OVER SCREEN ═══════════════ -->
<div id="gameover-screen" class="screen">
  <h1>🏆 Final Scores</h1>
  <div class="final-scores">
    <h3>Leaderboard</h3>
    <div id="final-score-rows"></div>
  </div>
  <button class="btn btn-primary" style="max-width:440px" onclick="location.reload()">Play Again</button>
</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const BACKEND_URL = 'https://wynyard-guesser-production.up.railway.app'; // e.g. https://wynyard-guesser.up.railway.app

  // Map bounds (Wynyard Quarter)
  const MAP_BOUNDS = {
    topLeft:     { lat: -36.835147, lng: 174.750291 },
    bottomRight: { lat: -36.846271, lng: 174.761380 }
  };

  // ── State ───────────────────────────────────────────────────────────────────
  let socket;
  let myId = null;
  let myName = '';
  let isHost = false;
  let currentRoomCode = '';
  let myScore = 0;
  let pendingGuess = null; // { lat, lng, xPct, yPct }
  let guessSubmitted = false;
  let timerInterval = null;
  let roundEndTime = null;
  let countdownInterval = null;
  let mapRect = null; // cached map bounding rect

  // ── Screen helpers ───────────────────────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showError(msg) {
    const el = document.getElementById('join-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  // ── Join ─────────────────────────────────────────────────────────────────────
  function joinGame() {
    const code = document.getElementById('room-code-input').value.trim().toUpperCase();
    const name = document.getElementById('player-name-input').value.trim();
    if (!code || code.length < 4) return showError('Enter a valid invite code.');
    if (!name) return showError('Enter your display name.');

    document.getElementById('join-btn').disabled = true;

    socket = io(BACKEND_URL, { transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
      socket.emit('join_room', { roomCode: code, playerName: name });
    });

    socket.on('connect_error', () => {
      showError('Cannot connect to server. Try again.');
      document.getElementById('join-btn').disabled = false;
    });

    socket.on('error', ({ message }) => {
      showError(message);
      document.getElementById('join-btn').disabled = false;
      socket.disconnect();
    });

    socket.on('joined_room', (data) => {
      myId = data.playerId;
      myName = name;
      isHost = data.isHost;
      currentRoomCode = data.roomCode;

      // Load map image
      document.getElementById('map-img').src = data.mapUrl;

      document.getElementById('lobby-code').textContent = data.roomCode;
      document.getElementById('round-count-display').textContent = `${data.totalRounds} rounds`;
      renderPlayerList(data.players);
      showScreen('lobby-screen');
      if (isHost) {
        document.getElementById('host-controls').style.display = 'block';
        document.getElementById('waiting-msg').style.display = 'none';
      }
    });

    socket.on('player_joined', ({ players }) => renderPlayerList(players));
    socket.on('player_left', ({ players }) => renderPlayerList(players));
    socket.on('new_host', ({ hostId }) => {
      if (hostId === myId) {
        isHost = true;
        document.getElementById('host-controls').style.display = 'block';
        document.getElementById('waiting-msg').style.display = 'none';
      }
    });

    socket.on('round_start', (data) => handleRoundStart(data));
    socket.on('guess_confirmed', (data) => handleGuessConfirmed(data));
    socket.on('player_guessed', ({ name }) => updateGuessedCount(name));
    socket.on('round_end', (data) => handleRoundEnd(data));
    socket.on('game_over', (data) => handleGameOver(data));
  }

  // ── Lobby ────────────────────────────────────────────────────────────────────
  function renderPlayerList(players) {
    const container = document.getElementById('player-list-items');
    document.getElementById('player-count').textContent = `(${players.length})`;
    container.innerHTML = players.map(p => `
      <div class="player-item">
        <div class="player-dot"></div>
        <span>${escHtml(p.name)}${p.id === myId ? ' <span style="color:var(--muted);font-size:0.75rem">(you)</span>' : ''}</span>
        ${p.isHost ? '<span class="host-badge">Host</span>' : ''}
      </div>
    `).join('');
  }

  function startGame() {
    socket.emit('start_game', { roomCode: currentRoomCode });
  }

  // ── Round Start ───────────────────────────────────────────────────────────────
  function handleRoundStart({ roundIndex, totalRounds, photoUrl, durationSeconds, label }) {
    pendingGuess = null;
    guessSubmitted = false;

    // Clear reveal phase state
    document.getElementById('reveal-panel').classList.remove('visible');
    clearAllGuessMarkers();
    const answerMarker = document.getElementById('answer-marker');
    if (answerMarker) answerMarker.style.display = 'none';

    document.getElementById('guess-marker').classList.remove('visible');
    document.getElementById('confirm-btn').classList.remove('visible');
    document.getElementById('confirm-btn').disabled = false;
    document.getElementById('guess-submitted-msg').classList.remove('visible');
    document.getElementById('results-overlay').classList.remove('visible');
    document.getElementById('guessed-count').textContent = '';

    document.getElementById('hud-round-num').textContent = roundIndex + 1;
    document.getElementById('hud-total-rounds').textContent = totalRounds;
    document.getElementById('round-photo').src = photoUrl;
    document.getElementById('photo-label').textContent = label || '';
    document.getElementById('hud-score').textContent = myScore;

    showScreen('game-screen');
    startTimer(durationSeconds);
  }

  // ── Timer ─────────────────────────────────────────────────────────────────────
  function startTimer(seconds) {
    clearInterval(timerInterval);
    roundEndTime = Date.now() + seconds * 1000;
    const timerEl = document.getElementById('hud-timer');

    function tick() {
      const remaining = Math.max(0, Math.ceil((roundEndTime - Date.now()) / 1000));
      timerEl.textContent = remaining;
      timerEl.classList.toggle('urgent', remaining <= 8);
      if (remaining <= 0) clearInterval(timerInterval);
    }

    tick();
    timerInterval = setInterval(tick, 250);
  }

  // ── Map Click ─────────────────────────────────────────────────────────────────
  function handleMapClick(event) {
    if (guessSubmitted) return;

    const mapPanel = document.getElementById('map-panel');
    const mapImg = document.getElementById('map-img');
    mapRect = mapImg.getBoundingClientRect();

    const clickX = event.clientX - mapRect.left;
    const clickY = event.clientY - mapRect.top;

    // Ignore clicks outside the actual image
    if (clickX < 0 || clickY < 0 || clickX > mapRect.width || clickY > mapRect.height) return;

    const xPct = clickX / mapRect.width;
    const yPct = clickY / mapRect.height;

    const lat = MAP_BOUNDS.topLeft.lat + yPct * (MAP_BOUNDS.bottomRight.lat - MAP_BOUNDS.topLeft.lat);
    const lng = MAP_BOUNDS.topLeft.lng + xPct * (MAP_BOUNDS.bottomRight.lng - MAP_BOUNDS.topLeft.lng);

    pendingGuess = { lat, lng, xPct, yPct };

    // Place marker
    const marker = document.getElementById('guess-marker');
    const panelRect = mapPanel.getBoundingClientRect();
    marker.style.left = (event.clientX - panelRect.left) + 'px';
    marker.style.top = (event.clientY - panelRect.top) + 'px';
    marker.classList.add('visible');

    document.getElementById('confirm-btn').classList.add('visible');
  }

  function confirmGuess(event) {
    event.stopPropagation();
    if (!pendingGuess || guessSubmitted) return;

    guessSubmitted = true;
    document.getElementById('confirm-btn').classList.remove('visible');
    document.getElementById('guess-submitted-msg').classList.add('visible');

    socket.emit('submit_guess', {
      roomCode: currentRoomCode,
      lat: pendingGuess.lat,
      lng: pendingGuess.lng
    });
  }

  function handleGuessConfirmed({ distanceScore, timeBonus, total, distanceMetres, yourScore }) {
    myScore = yourScore;
    document.getElementById('hud-score').textContent = myScore;
  }

  let guessedPlayers = [];
  function updateGuessedCount(name) {
    guessedPlayers.push(name);
    document.getElementById('guessed-count').textContent = `${guessedPlayers.length} guessed`;
  }

  // ── Round End ─────────────────────────────────────────────────────────────────
  function handleRoundEnd({ roundIndex, answerLat, answerLng, label, playerResults, nextRoundIn }) {
    clearInterval(timerInterval);
    guessedPlayers = [];
    guessSubmitted = true; // block map clicks during reveal

    // Clean up any pending guess UI
    document.getElementById('guess-marker').classList.remove('visible');
    document.getElementById('confirm-btn').classList.remove('visible');
    document.getElementById('guess-submitted-msg').classList.remove('visible');
    document.getElementById('guessed-count').textContent = '';

    // Show answer + all player guesses on the map
    showAnswerOnMap(answerLat, answerLng);
    showAllGuessesOnMap(playerResults, answerLat, answerLng);

    // Populate the reveal scoreboard in the photo panel
    document.getElementById('reveal-round-num').textContent = roundIndex + 1;
    document.getElementById('reveal-subtitle').innerHTML =
      label ? `📍 <span>${escHtml(label)}</span>` : `📍 <span>${answerLat.toFixed(5)}, ${answerLng.toFixed(5)}</span>`;

    const rows = playerResults.map((p, i) => {
      const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
      const distStr = p.distanceMetres !== null ? `${p.distanceMetres}m` : '—';
      const youTag = p.playerId === myId ? '<span class="result-you">YOU</span>' : '';
      const color = getPlayerColor(p.playerId);
      return `
        <div class="reveal-row">
          <div class="reveal-rank ${rankClass}">${i + 1}</div>
          <div class="reveal-color-dot" style="background:${color}"></div>
          <div class="reveal-name">${escHtml(p.name)}${youTag}</div>
          <div class="reveal-dist">${distStr}</div>
          <div class="reveal-round-score">+${p.roundScore}</div>
          <div class="reveal-total-score">${p.totalScore.toLocaleString()}</div>
        </div>
      `;
    }).join('');

    document.getElementById('reveal-rows').innerHTML = rows;
    document.getElementById('reveal-panel').classList.add('visible');

    // Countdown
    let secs = nextRoundIn;
    const cdEl = document.getElementById('reveal-countdown');
    clearInterval(countdownInterval);
    cdEl.innerHTML = `Next round in <span>${secs}</span>s`;
    countdownInterval = setInterval(() => {
      secs--;
      cdEl.innerHTML = `Next round in <span>${secs}</span>s`;
      if (secs <= 0) clearInterval(countdownInterval);
    }, 1000);
  }

  function showAnswerOnMap(lat, lng) {
    const mapImg = document.getElementById('map-img');
    const mapPanel = document.getElementById('map-panel');
    const rect = mapImg.getBoundingClientRect();
    const panelRect = mapPanel.getBoundingClientRect();

    const xPct = (lng - MAP_BOUNDS.topLeft.lng) / (MAP_BOUNDS.bottomRight.lng - MAP_BOUNDS.topLeft.lng);
    const yPct = (lat - MAP_BOUNDS.topLeft.lat) / (MAP_BOUNDS.bottomRight.lat - MAP_BOUNDS.topLeft.lat);

    // Create answer marker if not exists
    let answerMarker = document.getElementById('answer-marker');
    if (!answerMarker) {
      answerMarker = document.createElement('div');
      answerMarker.id = 'answer-marker';
      answerMarker.style.cssText = `
        position:absolute; width:20px; height:20px;
        background:var(--accent); border:3px solid white;
        border-radius:50% 50% 50% 0; transform:translate(-50%,-100%) rotate(-45deg);
        pointer-events:none; filter:drop-shadow(0 2px 4px #0008);
        z-index:10;
      `;
      mapPanel.appendChild(answerMarker);
    }

    answerMarker.style.left = (rect.left - panelRect.left + xPct * rect.width) + 'px';
    answerMarker.style.top = (rect.top - panelRect.top + yPct * rect.height) + 'px';
    answerMarker.style.display = 'block';
    answerMarker.style.zIndex = '13';
  }

  // ── Player Guess Reveal ───────────────────────────────────────────────────────
  const PLAYER_COLORS = Array.from({ length: 50 }, (_, i) => {
    const hue = Math.round((i * 137.508) % 360);
    const sat = [75, 80, 70][i % 3];
    const lit = [60, 55, 65][i % 3];
    return `hsl(${hue},${sat}%,${lit}%)`;
  });

  function getPlayerColor(playerId) {
    let hash = 0;
    for (let i = 0; i < playerId.length; i++) {
      hash = (hash << 5) - hash + playerId.charCodeAt(i);
      hash |= 0;
    }
    return PLAYER_COLORS[Math.abs(hash) % PLAYER_COLORS.length];
  }

  function showAllGuessesOnMap(playerResults, answerLat, answerLng) {
    clearAllGuessMarkers();

    const mapImg = document.getElementById('map-img');
    const mapPanel = document.getElementById('map-panel');
    const rect = mapImg.getBoundingClientRect();
    const panelRect = mapPanel.getBoundingClientRect();

    // Answer pixel position for line endpoints
    const ansXPct = (answerLng - MAP_BOUNDS.topLeft.lng) / (MAP_BOUNDS.bottomRight.lng - MAP_BOUNDS.topLeft.lng);
    const ansYPct = (answerLat - MAP_BOUNDS.topLeft.lat) / (MAP_BOUNDS.bottomRight.lat - MAP_BOUNDS.topLeft.lat);
    const ansX = rect.left - panelRect.left + ansXPct * rect.width;
    const ansY = rect.top - panelRect.top + ansYPct * rect.height;

    // Prepare SVG overlay for dashed lines
    const svg = document.getElementById('reveal-svg');
    svg.innerHTML = '';
    svg.style.display = 'block';

    const CLUSTER_THRESHOLD = 30;
    const LABEL_BASE_TOP = -32;
    const LABEL_STEP = 24;
    const placed = [];

    playerResults.forEach((p, i) => {
      if (!p.didGuess) return;

      const xPct = (p.guessLng - MAP_BOUNDS.topLeft.lng) / (MAP_BOUNDS.bottomRight.lng - MAP_BOUNDS.topLeft.lng);
      const yPct = (p.guessLat - MAP_BOUNDS.topLeft.lat) / (MAP_BOUNDS.bottomRight.lat - MAP_BOUNDS.topLeft.lat);

      const x = rect.left - panelRect.left + xPct * rect.width;
      const y = rect.top - panelRect.top + yPct * rect.height;

      // Dashed line from guess to answer
      const color = getPlayerColor(p.playerId);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x);
      line.setAttribute('y1', y);
      line.setAttribute('x2', ansX);
      line.setAttribute('y2', ansY);
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('stroke-dasharray', '6,4');
      line.setAttribute('stroke-opacity', '0.75');
      svg.appendChild(line);

      // Count nearby markers to stack labels
      let stackCount = 0;
      placed.forEach(q => {
        if (Math.abs(q.x - x) < CLUSTER_THRESHOLD && Math.abs(q.y - y) < CLUSTER_THRESHOLD) stackCount++;
      });
      placed.push({ x, y });

      const isMe = p.playerId === myId;

      const wrap = document.createElement('div');
      wrap.className = 'player-guess-wrap';
      wrap.style.left = x + 'px';
      wrap.style.top = y + 'px';

      const pin = document.createElement('div');
      pin.className = 'player-guess-pin';
      pin.style.background = color;

      const distText = p.distanceMetres !== null ? ` · ${p.distanceMetres}m` : '';
      const label = document.createElement('div');
      label.className = 'player-guess-label' + (isMe ? ' is-me' : '');
      label.textContent = p.name + distText;
      label.style.background = color;
      label.style.top = (LABEL_BASE_TOP - stackCount * LABEL_STEP) + 'px';

      wrap.appendChild(pin);
      wrap.appendChild(label);
      mapPanel.appendChild(wrap);
    });
  }

  function clearAllGuessMarkers() {
    document.querySelectorAll('.player-guess-wrap').forEach(el => el.remove());
    const svg = document.getElementById('reveal-svg');
    if (svg) { svg.innerHTML = ''; svg.style.display = 'none'; }
  }

  // ── Game Over ─────────────────────────────────────────────────────────────────
  function handleGameOver({ finalScores }) {
    clearInterval(timerInterval);
    document.getElementById('results-overlay').classList.remove('visible');

    const rows = finalScores.map((p, i) => {
      const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
      const youTag = p.id === myId ? ' <span style="color:var(--accent);font-size:0.75rem">(you)</span>' : '';
      return `
        <div class="final-row">
          <div class="final-rank ${rankClass}">${i + 1}</div>
          <div class="final-name">${escHtml(p.name)}${youTag}</div>
          <div class="final-score">${p.score.toLocaleString()}</div>
        </div>
      `;
    }).join('');

    document.getElementById('final-score-rows').innerHTML = rows;
    showScreen('gameover-screen');
  }

  // ── Utils ─────────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Pre-fill room code from URL param: ?code=XXXXXX
  const urlParams = new URLSearchParams(window.location.search);
  const codeParam = urlParams.get('code');
  if (codeParam) document.getElementById('room-code-input').value = codeParam.toUpperCase();

  // Enter key to join
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('join-screen').classList.contains('active')) joinGame();
  });
</script>
</body>
</html>
